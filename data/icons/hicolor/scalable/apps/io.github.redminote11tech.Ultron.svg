<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d32d"/>
      <stop offset="1" stop-color="#e5a50a"/>
    </linearGradient>
  </defs>

  <!-- rounded-square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- phone outline -->
  <g stroke="#ffffff" stroke-opacity="0.92" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="38" y="20" width="52" height="88" rx="12"/>
    <line x1="56" y1="99" x2="72" y2="99"/>
  </g>

  <!-- lightning bolt: Ultron -->
  <path d="M70 34 L52 68 L63 68 L57 94 L77 58 L65 58 Z" fill="url(#bolt)" stroke="#a4700a" stroke-width="2" stroke-linejoin="round"/>
</svg>
